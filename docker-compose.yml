# ─────────────────────────────────────────────────────────────────────────────
# Shared security defaults applied to every service via YAML anchors
# ─────────────────────────────────────────────────────────────────────────────
x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    <<: *security-defaults
    image: mongo:7
    container_name: callflow-mongodb
    # Do NOT expose 27017 to the host in production.
    # Uncomment the port binding below ONLY for local debugging:
    # ports:
    #   - "127.0.0.1:27017:27017"
    environment:
      # Set strong credentials via .env or Docker secrets — never commit these values
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-calleem}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/admin --quiet -u ${MONGO_ROOT_USER:-admin} -p ${MONGO_ROOT_PASSWORD} --authenticationDatabase admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - callflow-network

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    <<: *security-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callflow-backend
    # Only expose backend internally; Nginx/reverse-proxy handles public traffic
    # Uncomment for local development only:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # ── Database ────────────────────────────────────────────────
      MONGO_URI: mongodb://REDACTED:REDACTED@mongodb:27017/${MONGO_DB_NAME:-calleem}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-calleem}
      # ── Application ─────────────────────────────────────────────
      DEBUG: "false"
      ENVIRONMENT: production
      # ── Secrets (must be provided via .env or Docker secrets) ───
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY must be set}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN must be set}
      # ── JWT ─────────────────────────────────────────────────────
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # ── CORS (set to your actual frontend domain) ────────────────
      CORS_ORIGINS: ${CORS_ORIGINS:-https://calleem.tech,https://www.calleem.tech}
      BACKEND_URL: ${BACKEND_URL:-}
    env_file:
      # Optional: loads additional secrets from .env (never commit .env to git)
      - path: ./backend/.env
        required: false
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - callflow-network

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    <<: *security-defaults
    build:
      context: ./frontend_next
      dockerfile: Dockerfile
    container_name: callflow-frontend
    ports:
      - "3000:3000"
    environment:
      # API_URL: Docker-internal address for server-side Next.js rewrites (never sent to browser)
      API_URL: http://backend:8000
      # NEXT_PUBLIC_API_URL: the public HTTPS URL your users' browsers will call.
      # Set this to your actual production domain — NOT the internal Docker service name.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - callflow-network

  # ── Reverse Proxy (Nginx) ─────────────────────────────────────────────────
  nginx:
    <<: *security-defaults
    image: nginx:1.27-alpine
    container_name: callflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS certificates (e.g. from Let's Encrypt / Certbot)
      - ./infrastructure/certbot/conf:/etc/letsencrypt:ro
      - ./infrastructure/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - callflow-network
    profiles:
      - production

  # ── Prometheus (optional monitoring) ─────────────────────────────────────
  prometheus:
    <<: *security-defaults
    image: prom/prometheus:latest
    container_name: callflow-prometheus
    # Only bind locally; do not expose to public internet
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - callflow-network
    profiles:
      - monitoring

  # ── Grafana (optional monitoring) ────────────────────────────────────────
  grafana:
    <<: *security-defaults
    image: grafana/grafana:latest
    container_name: callflow-grafana
    # Only bind locally
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Must be overridden — never use the default in production
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - callflow-network
    profiles:
      - monitoring

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  callflow-network:
    driver: bridge
    # Restrict inter-container communication to named links only
    internal: false
