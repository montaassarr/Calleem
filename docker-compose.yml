version: "3.9"

services:
  mongodb:
    image: mongo:6.0
    container_name: ai-receptionist-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-SecurePassword123}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-ai_barber_receptionist}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ai-receptionist-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  core-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-receptionist-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://REDACTED:REDACTED@mongodb:27017/${MONGO_DB_NAME:-ai_barber_receptionist}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ai_barber_receptionist}
      DEBUG: "False"
      ENVIRONMENT: production
      APP_NAME: "AI Receptionist Core"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - ai-receptionist-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  n8n:
    image: n8nio/n8n:latest
    container_name: ai-receptionist-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-password}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      - GENERIC_TIMEZONE=${TIMEZONE:-America/New_York}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai-receptionist-network

  frontend:
    build:
      context: ./frontend_next
      dockerfile: Dockerfile
    container_name: ai-receptionist-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://core-service:8000/api/v1
    depends_on:
      core-service:
        condition: service_healthy
    networks:
      - ai-receptionist-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  parker_agent:
    build:
      context: ./Parker_165
      dockerfile: Dockerfile
    container_name: ai-receptionist-parker-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_AGENT_QUEUE: ${LIVEKIT_AGENT_QUEUE:-voice-agents}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-Parker_165}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook}
    depends_on:
      core-service:
        condition: service_healthy
    networks:
      - ai-receptionist-network
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep 'src/agent.py'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  n8n_data:
    driver: local

networks:
  ai-receptionist-network:
    driver: bridge
