version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: ai-receptionist-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-SecurePassword123}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-ai_barber_receptionist}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ai-receptionist-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis (optional - for caching and background tasks)
  redis:
    image: redis:7-alpine
    container_name: ai-receptionist-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-receptionist-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-receptionist-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      MONGO_URI: mongodb://REDACTED:REDACTED@mongodb:27017/${MONGO_DB_NAME:-ai_barber_receptionist}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ai_barber_receptionist}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Application
      DEBUG: "${DEBUG:-False}"
      ENVIRONMENT: ${ENVIRONMENT:-production}

      # API Keys & Secrets (Passed from .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      VAPI_API_KEY: ${VAPI_API_KEY}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - ai-receptionist-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: ai-receptionist-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-receptionist-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  ai-receptionist-network:
    driver: bridge
