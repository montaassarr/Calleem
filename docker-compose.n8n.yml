version: '3.8'

services:
  # ============================================================================
  # N8N Automation Engine
  # ============================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: callflow-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Basic Authentication
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-ChangeThisSecurePassword123!}
      
      # Server Configuration
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_PORT=5678
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      
      # Timezone
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Los_Angeles}
      
      # Logging
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=${N8N_LOG_OUTPUT:-console}
      
      # Execution Settings
      - EXECUTIONS_TIMEOUT=${N8N_EXECUTION_TIMEOUT:-3600}
      - EXECUTIONS_TIMEOUT_MAX=${N8N_EXECUTION_TIMEOUT_MAX:-3600}
      
      # Data Retention (Auto-cleanup old executions)
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=${N8N_EXECUTIONS_MAX_AGE:-168}  # 7 days
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=3600
      
      # Performance
      - N8N_PAYLOAD_SIZE_MAX=16
      - N8N_METRICS=true
      
      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-generate-a-random-32-char-key-here}
      
      # External Services (optional - for production)
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=postgres
      # - DB_POSTGRESDB_PORT=5432
      # - DB_POSTGRESDB_DATABASE=n8n
      # - DB_POSTGRESDB_USER=n8n
      # - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      
    volumes:
      # Persistent data storage
      - n8n_data:/home/node/.n8n
      
      # Optional: Mount custom nodes or workflow templates
      # - ./n8n_workflows:/home/node/.n8n/workflows:ro
      # - ./custom_nodes:/home/node/.n8n/custom:ro
      
    networks:
      - callflow_network
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # PostgreSQL (Optional - for production n8n)
  # Recommended for production to replace SQLite
  # ============================================================================
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: callflow-n8n-postgres
  #   restart: always
  #   environment:
  #     - POSTGRES_DB=n8n
  #     - POSTGRES_USER=n8n
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:REDACTED}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - callflow_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U n8n"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  n8n_data:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  callflow_network:
    driver: bridge
    name: callflow_network

# ============================================================================
# USAGE INSTRUCTIONS
# ============================================================================
# 
# 1. Create .env file in the same directory:
#    N8N_PASSWORD=YourSecurePassword123!
#    N8N_HOST=localhost  # or your domain
#    N8N_PROTOCOL=http   # or https for production
#    N8N_WEBHOOK_URL=http://localhost:5678/  # or https://n8n.yourdomain.com/
#    N8N_ENCRYPTION_KEY=your-random-32-character-encryption-key-here
#    TIMEZONE=America/Los_Angeles
# 
# 2. Start n8n:
#    docker-compose -f docker-compose.n8n.yml up -d
# 
# 3. View logs:
#    docker logs -f callflow-n8n
# 
# 4. Access dashboard:
#    http://localhost:5678
#    Username: admin
#    Password: (from N8N_PASSWORD in .env)
# 
# 5. Stop n8n:
#    docker-compose -f docker-compose.n8n.yml down
# 
# 6. Update n8n:
#    docker-compose -f docker-compose.n8n.yml pull
#    docker-compose -f docker-compose.n8n.yml up -d
# 
# ============================================================================
# PRODUCTION DEPLOYMENT
# ============================================================================
# 
# For production, update these settings:
# 
# 1. Enable HTTPS:
#    N8N_PROTOCOL=https
#    N8N_HOST=n8n.yourdomain.com
#    N8N_WEBHOOK_URL=https://n8n.yourdomain.com/
# 
# 2. Use PostgreSQL (uncomment postgres service above)
# 
# 3. Set strong passwords:
#    N8N_PASSWORD=<random-64-char-password>
#    POSTGRES_PASSWORD=<random-64-char-password>
#    N8N_ENCRYPTION_KEY=<random-32-char-key>
# 
# 4. Add Nginx reverse proxy:
#    See n8n_workflows/QUICK_START.md for Nginx config
# 
# 5. Enable SSL with Let's Encrypt:
#    certbot --nginx -d n8n.yourdomain.com
# 
# 6. Set up backups:
#    docker run --rm -v n8n_data:/data -v $(pwd):/backup \
#      alpine tar czf /backup/n8n_backup_$(date +%Y%m%d).tar.gz /data
# 
# ============================================================================
